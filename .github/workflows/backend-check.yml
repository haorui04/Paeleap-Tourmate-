name: Application checks
on:
  push:
    branches: [main, frontend, feature/ai-backend-day1, feature/frontend-chat, feature/tourmate-production-hardened]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run faq:check
      - run: npm test
      - run: npm run build
