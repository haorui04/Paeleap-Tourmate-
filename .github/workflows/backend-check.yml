name: Application checks
on:
  push:
    branches: [main, frontend, feature/ai-backend-day1, feature/frontend-chat, feature/tourmate-production-hardened]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run faq:check
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run test:redteam -- --out reports/redteam-ci.json
      - run: npm run test:redteam -- --mode provider-adversarial --out reports/redteam-provider-fixture-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-redteam-evidence
          path: reports/redteam*-ci.json
          retention-days: 30
      - run: npm run build
